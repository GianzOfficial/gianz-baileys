name: Syntax check
on:
  push:
  pull_request:
jobs:
  node-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: node --check semua file .js
        run: find lib WAProto examples -name '*.js' -print0 | xargs -0 -n1 node --check
